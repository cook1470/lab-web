 const L=(a,b,w,h,k)=>R(a,b,w,h,k);const bob=walk?(frame%2):(frame);// 走路 1 格上下、呼吸 1 格

// ---- 狀態 ----
const S={scene:0,x:60,dir:1,t:0,walk:false,wf:0,ride:false,fade:0,fadeTo:null,mx:200,prompt:''};
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==' '||e.key.toLowerCase()=='e'){act();e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let touch=0;c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;if(f<.35)touch=-1;else if(f>.65)touch=1;else act()});
addEventListener('pointerup',()=>touch=0);
function near(){return S.scene==1&&Math.abs(S.x+6-(S.mx+13))<20}
function act(){if(S.ride){S.ride=false;S.x=S.mx-10;S.dir=-1;S.spin=0}else if(near()){S.ride=true;S.spin=40}}
function update(){S.t++;if(S.fadeTo!=null){S.fade+=.08;if(S.fade>=1){S.scene=S.fadeTo;S.x=S.fadeTo==1?4:302;S.fadeTo=null;S.fade=-1}return}
 if(S.fade<0){S.fade=Math.min(0,S.fade+.08)}
 let m=(keys.a||keys.arrowleft||touch<0?-1:0)+(keys.d||keys.arrowright||touch>0?1:0);if(S.ride)m=0;
 S.walk=m!=0;if(m){S.dir=m;S.x+=m*.8;if(S.t%8==0)S.wf=(S.wf+1)%4}else S.wf=0;
 if(S.x>306){if(S.scene==0)S.fadeTo=1;else S.x=306}
 if(S.x<2){if(S.scene==1)S.fadeTo=0;else S.x=2}
 if(S.spin)S.spin--}

 if(S.scene==0){house(30);smokeTick(30,t);furnace(110,t);crate(150);truck(186);terminal(262,t);
  R(100,GY-1,120,1,14);// 水泥地邊
  label('老家基地',4)}
 else{headframe(20,t);mine(120);sign(90);machine(S.mx,S.ride,S.spin?t:0);label('礦坑口',4);
  if(near()&&!S.ride)txt('E 坐上礦機',S.mx-8,GY-34);if(S.ride)txt('E 下車',S.mx+2,GY-34)}

// 3x5 像素字（只給數字以外用 canvas 字體會糊，這裡用整數縮放的小字）
const HUD=document.getElementById('hud');let hudq=[];function txt(s,x,y){hudq.push([s,x,y])}
function label(s,x){txt(s,x,4)}
function flushHud(){const k=hudq.map(q=>q.join()).join('|');if(k!=HUD.dataset.k){HUD.dataset.k=k;HUD.innerHTML=hudq.map(([s,x,y])=>`<span style="left:${x/3.2}%;top:${y/1.8}%">${s}</span>`).join('')}hudq=[]}
// 固定每秒 60 次更新（製作人：360Hz 螢幕上走太快）；畫面照螢幕刷新率畫
let _last=performance.now(),_acc=0;const STEP=1000/60;
function loop(now){_acc+=Math.min(250,now-_last);_last=now;while(_acc>=STEP){update();_acc-=STEP}draw();flushHud();requestAnimationFrame(loop)}requestAnimationFrame(t=>{_last=t;loop(t)});
window.__S=S;
