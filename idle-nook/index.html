<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小窩</title>
<style>
html,body{margin:0;height:100%;background:#1a1c2c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif}
canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#quietBtn{position:fixed;top:8px;right:8px;z-index:5;background:rgba(26,28,44,.72);color:#f4f4f4;border:2px solid #566c86;border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.3;cursor:pointer;}
#quietBtn.on{background:rgba(87,63,116,.85);border-color:#a7f070;color:#a7f070}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:#333c57;color:#f4f4f4;border:3px solid #94b0c2;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.7;max-width:min(78vw,380px);text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.35);display:none}
#ui{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
#ui svg{position:absolute;inset:0;width:100%;height:100%}
.chip{position:absolute;background:rgba(26,28,44,.78);color:#f4f4f4;font-size:12px;line-height:1.35;padding:2px 7px;border-radius:6px;white-space:nowrap}
.chip small{font-size:12px;color:#ffcd75}
.chip.lock{background:rgba(58,36,24,.9);border:1px solid #ffcd75;white-space:normal;text-align:center}
.chip.lock.can{border-color:#a7f070;color:#a7f070}
.chip.deny{border-color:#b13e53;background:rgba(120,30,40,.92)}
#hud{position:fixed;top:8px;left:8px;z-index:5;background:rgba(26,28,44,.8);color:#f4f4f4;border:2px solid #566c86;border-radius:10px;padding:4px 10px;font-size:14px;line-height:1.35}
#hud b{color:#ffcd75;font-size:16px}#hud span{color:#94b0c2;font-size:12px}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;background:rgba(26,28,44,.85);color:#f4f4f4;border-radius:8px;padding:5px 12px;font-size:13px;max-width:92vw;text-align:center;pointer-events:none}
.callout{position:absolute;background:#f4f4f4;color:#1a1c2c;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#info{position:fixed;z-index:8;width:min(250px,86vw);background:#333c57;color:#f4f4f4;border:3px solid #ffcd75;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;display:none;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#info h3{margin:0 0 2px;font-size:16px;color:#ffcd75}#info .role{font-size:12px;color:#94b0c2}
#info .row{margin-top:4px}#info .k{color:#94b0c2}#info .x{font-size:12px;color:#94b0c2;margin-top:6px}
#card b{color:#ffcd75}
#card .hint{display:block;margin-top:8px;font-size:11px;color:#94b0c2}
</style></head>
<body>
<canvas id="c"></canvas>
<button id="quietBtn">🔊 安靜模式</button>
<div id="ui"><svg id="lines"></svg></div>
<div id="hud"></div>
<div id="hint"></div>
<div id="info"></div>
<div id="card"></div>
<script src="game.js"></script>
</body></html>
