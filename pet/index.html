<h1>原型・桌面小東西</h1>
<p class="d">影片裡那些視窗是假的，畫來讓你看得出牠是站在別的視窗前面。</p>
<video src="./pet.mp4" autoplay loop muted playsinline controls></video>
<p><b>真的跑起來是這樣</b>：一個無邊框、背景透明、永遠在最上層的小視窗貼在桌面上。
滑鼠預設<b>穿透</b>——你照常點底下的東西，只有點在牠身上才會被牠接走（牠會瞇眼、冒一顆心）。</p>
<p>牠自己做的事：走來走去、地上冒出東西就跑去撿、撿了搬回窩、窩裡的存貨慢慢變多。
你什麼都不用做，這就是「放置」那一半。</p>
<p class="d">這支只回答一個問題：它一直在那裡、你在做別的事、它自己在動——這個感覺對不對。
對的話再談玩法（要不要有成長、要不要能互動、要不要有結局）。</p>
